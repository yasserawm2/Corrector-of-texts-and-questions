<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحح الذكي</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 120px; padding: 12px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { background: #2563eb; }
        .result { background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #334155; white-space: pre-wrap; min-height: 50px; }
    </style>
</head>
<body>
    <h2>✍️ المصحح الذكي ومحسن النصوص</h2>
    <p>اكتب أو الصق النص أدناه لتحسينه عبر الذكاء الاصطناعي:</p>
    <textarea id="inputText" placeholder="اكتب نصك هنا..."></textarea>
    <button onclick="refineText()">تصحيح وتحسين النص</button>
    <h3>النتيجة:</h3>
    <div id="resultBox" class="result">ستظهر النتيجة هنا...</div>

    <script>
        async function refineText() {
            const text = document.getElementById('inputText').value;
            const resultBox = document.getElementById('resultBox');
            if (!text.trim()) { alert('الرجاء إدخال نص أولاً!'); return; }
            resultBox.innerText = 'جاري المعالجة بالذكاء الاصطناعي... ⏳';
            try {
                const res = await fetch('/api/refine', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.result) {
                    resultBox.innerText = data.result;
                } else {
                    resultBox.innerText = 'خطأ: ' + (data.error || 'فشل الاتصال');
                }
            } catch (err) {
                resultBox.innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
        }
    </script>
</body>
</html>
